<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>A Very Important Question 👀</title>
  <style>
    :root{
      --bg1:#fff0f5;
      --bg2:#ffe4ec;
      --card:#ffffffee;
      --text:#2b2130;
      --muted:#6f5b72;
      --yes:#ff4f81;
      --yes-dark:#e73d6d;
      --no:#f1eef2;
      --shadow:0 18px 50px rgba(90,45,70,.18);
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:20px;
      font-family:Inter, ui-rounded, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top left, #ffd6e4 0, transparent 38%),
        radial-gradient(circle at bottom right, #ffdff3 0, transparent 35%),
        linear-gradient(145deg,var(--bg1),var(--bg2));
      overflow:hidden;
    }

    .card{
      width:min(92vw,520px);
      min-height:520px;
      background:var(--card);
      border:1px solid rgba(255,255,255,.75);
      border-radius:30px;
      box-shadow:var(--shadow);
      padding:38px 24px 30px;
      text-align:center;
      position:relative;
      overflow:hidden;
      backdrop-filter:blur(12px);
    }

    .emoji{
      font-size:64px;
      animation:float 2.4s ease-in-out infinite;
      display:inline-block;
      margin-bottom:8px;
    }

    @keyframes float{
      0%,100%{transform:translateY(0) rotate(-2deg)}
      50%{transform:translateY(-8px) rotate(2deg)}
    }

    h1{
      margin:10px 0 12px;
      font-size:clamp(30px,7vw,46px);
      line-height:1.08;
    }

    .subtitle{
      margin:0 auto 24px;
      max-width:390px;
      color:var(--muted);
      font-size:17px;
      line-height:1.55;
    }

    .message{
      min-height:30px;
      margin:10px 0 20px;
      font-weight:700;
      color:#b33a67;
      font-size:16px;
    }

    .button-zone{
      height:170px;
      position:relative;
      width:100%;
      margin-top:8px;
    }

    button{
      border:none;
      border-radius:999px;
      padding:16px 28px;
      font-size:18px;
      font-weight:800;
      cursor:pointer;
      transition:transform .18s ease, box-shadow .18s ease, left .22s ease, top .22s ease;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }

    #yesBtn{
      background:linear-gradient(135deg,var(--yes),#ff7098);
      color:white;
      box-shadow:0 10px 24px rgba(255,79,129,.35);
      position:absolute;
      left:18%;
      top:48px;
    }

    #yesBtn:active{transform:scale(.96)}

    #noBtn{
      background:var(--no);
      color:#4c414e;
      box-shadow:0 8px 20px rgba(70,55,70,.10);
      position:absolute;
      right:18%;
      top:48px;
    }

    .tiny{
      margin-top:4px;
      color:#9a849a;
      font-size:13px;
    }

    .success{
      display:none;
      position:absolute;
      inset:0;
      padding:42px 26px;
      background:
        radial-gradient(circle at 20% 10%, #ffd8e5 0, transparent 35%),
        linear-gradient(145deg,#fff7fa,#ffe9f1);
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
    }

    .success.show{display:flex}

    .success h2{
      font-size:clamp(32px,8vw,50px);
      margin:12px 0 10px;
    }

    .success p{
      color:var(--muted);
      font-size:18px;
      line-height:1.55;
      max-width:380px;
    }

    .hearts{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
    }

    .heart{
      position:absolute;
      bottom:-30px;
      font-size:22px;
      animation:rise 3.2s linear forwards;
    }

    @keyframes rise{
      to{
        transform:translateY(-700px) rotate(25deg);
        opacity:0;
      }
    }

    @media(max-width:520px){
      .card{
        min-height:500px;
        padding-top:30px;
      }
      .button-zone{
        height:190px;
      }
      #yesBtn{
        left:10%;
      }
      #noBtn{
        right:10%;
      }
    }
  </style>
</head>

<body>
  <main class="card" id="card">
    <div class="emoji">☕✨</div>
    <h1>Okayyy, important question 👀</h1>
    <p class="subtitle">
      Devanshi, would you like to go on another little adventure with me?
    </p>

    <div class="message" id="message">Choose wisely 😌</div>

    <div class="button-zone" id="zone">
      <button id="yesBtn">Yes obviously 😌</button>
      <button id="noBtn">No 😂</button>
    </div>

    <div class="tiny">This website is definitely not trying to influence your decision 😂</div>

    <section class="success" id="success">
      <div class="emoji">🥹✨</div>
      <h2>Yayyy!</h2>
      <p>
        Excellent decision 😌<br><br>
        Your next little adventure with Raj is confirmed 😌
        Details coming soon 👀
      </p>
    </section>

    <div class="hearts" id="hearts"></div>
  </main>

  <script>
    const noMessages = [
      "Okay okay... I'll get you a Crunchwrap 🌯",
      "Fineee, adding a pastry or cookie too 🍪",
      "You're making me bring out the big guns... OG THEPLAAAA 😭",
      "Crunchwrap + dessert + THEPLAAAA?? This is becoming a full negotiation 😂",
      "Crunchwrap + dessert + THEPLAAAA... literally all of it 😭😂"
    ];

    let noCount = 0;

    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const zone = document.getElementById("zone");
    const message = document.getElementById("message");
    const success = document.getElementById("success");
    const hearts = document.getElementById("hearts");

    function moveNoButton(){
      const zoneRect = zone.getBoundingClientRect();
      const btnRect = noBtn.getBoundingClientRect();

      const maxX = Math.max(0, zoneRect.width - btnRect.width);
      const maxY = Math.max(0, zoneRect.height - btnRect.height);

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.right = "auto";
      noBtn.style.top = y + "px";

      const grow = 1 + Math.min(noCount, 5) * 0.09;
      yesBtn.style.transform = `scale(${grow})`;
    }

    function handleNoAttempt(e){
      if(noCount < 5){
        if(e) e.preventDefault();
        message.textContent = noMessages[noCount];
        noCount++;
        moveNoButton();

        if(noCount === 5){
          noBtn.textContent = "Okay fine 😭";
          setTimeout(() => {
            message.textContent = "Fineee, now you can actually choose 😂";
          }, 500);
        }
      } else {
        message.textContent = "Respect 😭 I had to let you choose for real.";
        noBtn.textContent = "No";
      }
    }

    noBtn.addEventListener("click", handleNoAttempt);

    yesBtn.addEventListener("click", () => {
      success.classList.add("show");
      launchHearts();
    });

    function launchHearts(){
      const symbols = ["✨","🤍","✨"];
      for(let i = 0; i < 8; i++){
        setTimeout(() => {
          const h = document.createElement("span");
          h.className = "heart";
          h.textContent = symbols[Math.floor(Math.random()*symbols.length)];
          h.style.left = Math.random()*100 + "%";
          h.style.animationDuration = (2.4 + Math.random()*2.3) + "s";
          hearts.appendChild(h);
          setTimeout(() => h.remove(), 5000);
        }, i * 70);
      }
    }
  </script>
</body>
</html>
